<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{settings.school_name}} | Set new password</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"><style>{{theme_style|safe}}.auth-box{max-width:720px;margin:70px auto}.identity{padding:14px;border-radius:14px;background:rgba(127,127,127,.08);margin:12px 0 18px}.password-stack{display:grid;gap:12px}</style></head><body class="auth-body"><main class="content auth-box"><section class="panel glass">{% if invalid %}<div class="eyebrow">Password recovery</div><h1>Reset link unavailable</h1><div class="flash danger">{{error}}</div><a class="btn btn-ghost" href="/forgot-password">Request another link</a>{% else %}<div class="eyebrow">Verified account</div><h1>Create a new password</h1><div class="identity"><strong>{{user.full_name}}</strong><div class="muted">Username: {{user.username}} · Role: {{user.role}}</div></div>{% if error %}<div class="flash danger">{{error}}</div>{% endif %}<form method="post" class="stack-form" autocomplete="off"><label><span>Username</span><input name="username" value="{{user.username}}" required autocomplete="username"></label><div class="password-stack"><label><span>New password</span><div class="password-wrap"><input id="newPassword" type="password" name="password" minlength="8" required autocomplete="new-password"><button type="button" class="password-toggle" data-password-target="newPassword">Show</button></div></label><label><span>Repeat new password</span><div class="password-wrap"><input id="confirmPassword" type="password" name="confirm_password" minlength="8" required autocomplete="new-password"><button type="button" class="password-toggle" data-password-target="confirmPassword">Show</button></div></label></div><button class="btn btn-primary" type="submit">Save new password</button></form>{% endif %}</section></main><script>document.addEventListener('click',function(e){const b=e.target.closest('.password-toggle');if(!b)return;const i=document.getElementById(b.dataset.passwordTarget);if(!i)return;i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Show':'Hide';});</script></body></html>
