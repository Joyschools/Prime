<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/prime-upgrade.css') }}"></head>
<body class="prime-body"><main class="reset-shell"><section class="reset-card"><div class="eyebrow">Secure account recovery</div><h1>Reset your password</h1><p class="muted">Set a new password for {{ full_name }}. This link is one-time and expires automatically.</p>{% if error %}<div class="flash danger">{{ error }}</div>{% endif %}<form method="post" class="stack-form"><input type="password" name="password" minlength="8" autocomplete="new-password" placeholder="New password" required><input type="password" name="confirm_password" minlength="8" autocomplete="new-password" placeholder="Confirm new password" required><button class="btn-prime" type="submit">Update password</button></form></section></main></body></html>
