
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/prime-upgrade.css') }}?v={{ upgrade_css_version }}"><style id="ui-primary-vars">:root{--ui-primary:{{ school_settings.primary_color if school_settings else ui_primary }};--ui-accent:{{ school_settings.accent_color if school_settings else ui_accent }};--brand-bg:{{ school_settings.background_color if school_settings else "#101318" }};--brand-panel:{{ school_settings.panel_color if school_settings else "#171b22" }};--heading-font:"{{ school_settings.heading_font if school_settings else ui_heading_font }}",Inter,sans-serif;--body-font:"{{ school_settings.body_font if school_settings else ui_body_font }}",Inter,sans-serif}</style></head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-card glass">
      <div class="eyebrow">School portal</div>
      <h1>{{ title }}</h1>
      <p class="muted">{{ message }}</p>
      <a class="btn btn-primary btn-block" href="{{ url_for('login') }}">Go back</a>
    </section>
  </main>
<footer class="portal-watermark">© 2026 Toror Technology and Innovations Ltd. All rights reserved.</footer>
<style>
.portal-watermark{margin-top:36px;padding:16px 20px;text-align:center;font-size:12px;opacity:.62;letter-spacing:.15px;border-top:1px solid rgba(255,255,255,.08)}
</style>
</body>
</html>
