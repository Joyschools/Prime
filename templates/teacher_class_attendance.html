<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{settings.school_name}} | Class Register</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"><style>{{theme_style|default('', true)|safe}}</style></head><body class="app-body"><main class="content"><header class="topbar glass"><div><div class="eyebrow">Teacher</div><h1>Class register</h1><div class="topbar-subtitle">Record the actual attendance of learners assigned to your class/subject</div></div><div class="top-actions"><a class="btn btn-ghost" href="/teacher-dashboard">Teacher</a><a class="btn btn-ghost" href="/logout">Logout</a></div></header><section class="panel glass"><form method="get" class="stack-form two-col"><label><span>Class</span><select name="class_name" required><option value="">Select class</option>{% for c in classes %}<option value="{{c}}" {% if c==selected_class %}selected{% endif %}>{{c}}</option>{% endfor %}</select></label><label><span>Subject / unit</span><input name="subject" value="{{subject}}" required></label><label><span>Date</span><input type="date" name="attendance_date" value="{{attendance_date}}"></label><div><span>&nbsp;</span><button class="btn btn-primary">Load register</button></div></form></section>{% if students %}<section class="panel glass"><form method="post"><input type="hidden" name="class_name" value="{{selected_class}}"><input type="hidden" name="subject" value="{{subject}}"><input type="hidden" name="attendance_date" value="{{attendance_date}}"><div class="table-wrap"><table><thead><tr><th>Learner</th><th>Admission</th><th>Status</th><th>Note</th></tr></thead><tbody>{% for st in students %}<tr><td>{{st.full_name}}</td><td>{{st.admission_no}}</td><td><select name="attendance_{{st.id}}"><option>Present</option><option>Absent</option><option>Late</option><option>Excused</option></select></td><td><input name="note_{{st.id}}" placeholder="Optional"></td></tr>{% endfor %}</tbody></table></div><button class="btn btn-primary" style="margin-top:14px">Save class attendance</button></form></section>{% endif %}</main></body></html>
